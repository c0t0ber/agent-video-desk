[project]
name = "agent-video-desk"
version = "0.1.0"
description = "Agent skills for Claude Code and Codex: Script Desk, Footage Desk, verbatim Russian transcription"
requires-python = ">=3.11"

[tool.ruff]
line-length = 170
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# The code is deliberately compact: one-line short branches and comma-separated imports.
ignore = ["E401", "E701", "E702", "UP015", "UP031"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
