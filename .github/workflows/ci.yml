name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; else brew install ffmpeg; fi
      - name: Lint
        run: pipx run ruff==0.17.0 check .
      - name: Validate manifests
        run: for f in .claude-plugin/*.json .codex-plugin/*.json .agents/plugins/*.json; do python -m json.tool "$f" > /dev/null; done
      - name: Tests
        run: python -m unittest discover -s tests -v
