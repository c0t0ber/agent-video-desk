<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Footage Desk</title>
<style>
  :root {
    --bg: #121418; --panel: #1a1d23; --panel2: #20242c; --line: #2c313b; --fg: #ebe8e2; --dim: #8d929d;
    --take: #43b871; --skip: #e2594d; --ai: #f2a24a; --sel: #6c9bff; --seen: #566072;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  button { font: inherit; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: #4a5160; background: #262b34; }
  button.on { background: #33405c; border-color: var(--sel); }
  button.take { border-color: var(--take); color: #c9f3d8; } button.skip { border-color: var(--skip); color: #ffd3ce; }
  kbd { font: 11px var(--mono); background: #2b303a; border: 1px solid #3a404c; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: #cfd3da; margin-left: 5px; }
  input[type=text], textarea { font: inherit; color: var(--fg); background: #15181d; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
  input:focus, textarea:focus { outline: none; border-color: var(--sel); }
  body { display: grid; grid-template-columns: 310px 1fr; }

  /* ── clip list ── */
  #side { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--panel); min-height: 0; height: 100vh; }
  #side header { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  #side h1 { font-size: 17px; font-weight: 700; letter-spacing: .01em; }
  #side h1 span { color: var(--dim); font-weight: 500; }
  #totals { margin-top: 8px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12.5px; color: var(--dim); }
  #totals b { color: var(--fg); font: 600 12.5px var(--mono); text-align: right; }
  #clips { flex: 1; overflow-y: auto; padding: 4px 0 20px; }
  .day { position: sticky; top: 0; z-index: 2; padding: 9px 16px 5px; font: 700 11px var(--mono); letter-spacing: .12em; color: var(--ai); background: var(--panel); }
  .clip { padding: 7px 16px 8px; cursor: pointer; border-left: 3px solid transparent; }
  .clip:hover { background: #20242b; }
  .clip.cur { background: #252a34; border-left-color: var(--sel); }
  .clip .r1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .clip .nm { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip .tm { font: 11.5px var(--mono); color: var(--dim); white-space: nowrap; }
  .clip .sub { font-size: 11.5px; color: var(--dim); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini { position: relative; height: 13px; margin-top: 5px; background: #14171c; border-radius: 3px; overflow: hidden; }
  .mini i { position: absolute; display: block; }
  .mini .s { top: 0; height: 3px; background: var(--seen); }
  .mini .a { top: 4px; height: 3px; background: var(--ai); }
  .mini .t { top: 8px; height: 5px; background: var(--take); } .mini .k { top: 8px; height: 5px; background: var(--skip); }
  #save { padding: 9px 16px; border-top: 1px solid var(--line); font: 11.5px var(--mono); color: var(--dim); }
  #save.err { color: #fff; background: #8f2b22; }

  /* ── main ── */
  main { display: flex; flex-direction: column; min-width: 0; height: 100vh; position: relative; }
  #top { display: flex; height: 43vh; min-height: 250px; border-bottom: 1px solid var(--line); }
  #stage { flex: 1; background: #000; min-width: 0; display: flex; }
  #v { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #panel { width: 370px; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); min-height: 0; }
  #cliphead { padding: 12px 14px 8px; }
  #cliphead .t { font-size: 16px; font-weight: 700; }
  #cliphead .m { font: 12px var(--mono); color: var(--dim); margin-top: 2px; }
  #tools { padding: 0 14px 10px; display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); }
  #tools button { padding: 4px 9px; font-size: 12.5px; }
  #lists { flex: 1; overflow-y: auto; padding: 4px 0 12px; }
  .lh { padding: 10px 14px 4px; font: 700 11px var(--mono); letter-spacing: .1em; color: var(--dim); display: flex; justify-content: space-between; }
  .item { padding: 6px 14px; display: grid; grid-template-columns: 4px 1fr auto; gap: 9px; align-items: start; cursor: pointer; }
  .item:hover { background: #20242b; }
  .item .bar { align-self: stretch; border-radius: 2px; }
  .item .tc { font: 11.5px var(--mono); color: var(--dim); }
  .item .nt { font-size: 13px; line-height: 1.3; }
  .item .st { font-size: 11px; font-weight: 700; }
  .item .acts { display: flex; gap: 4px; }
  .item .acts button { padding: 1px 7px; font-size: 12px; }
  .item input { margin-top: 4px; font-size: 12.5px; padding: 3px 6px; }
  .empty { padding: 4px 14px; color: var(--dim); font-size: 12.5px; }
  #clipnote { margin: 4px 14px 0; width: calc(100% - 28px); min-height: 46px; resize: vertical; font-size: 13px; }

  /* ── strip ── */
  #strip { position: relative; height: 62px; background: #15181d; border-bottom: 1px solid var(--line); cursor: crosshair; user-select: none; flex: none; }
  #strip i { position: absolute; display: block; pointer-events: none; }
  #strip .s { top: 5px; height: 4px; background: var(--seen); }
  #strip .a { top: 13px; height: 9px; background: var(--ai); opacity: .9; border-radius: 2px; }
  #strip .t { top: 26px; height: 13px; background: var(--take); border-radius: 2px; } #strip .k { top: 26px; height: 13px; background: var(--skip); border-radius: 2px; opacity: .75; }
  #strip .w { top: 44px; height: 9px; background: #6d7482; width: 1px; }
  #strip .x { top: 0; bottom: 0; background: rgba(108, 155, 255, .28); border-left: 2px solid var(--sel); border-right: 2px solid var(--sel); }
  #strip .ph { top: 0; bottom: 0; width: 2px; background: #fff; }
  #strip .lg { top: 3px; right: 8px; font: 10.5px var(--mono); color: var(--dim); text-align: right; line-height: 13.4px; }

  /* ── transcript ── */
  #text { flex: 1; overflow-y: auto; padding: 14px 22px 130px; user-select: none; }
  .blk { display: grid; grid-template-columns: 54px 1fr; gap: 0 8px; margin-bottom: 6px; }
  .blk .tc { font: 11.5px var(--mono); color: #6b717c; padding-top: 9px; cursor: pointer; }
  .blk .tc:hover { color: var(--fg); }
  .blk .body { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 1px; }
  .tok.w { font-size: 19px; line-height: 1.55; padding: 1px 4px; border-radius: 5px; cursor: pointer; color: #b9bdc6; }
  .tok.w.seen { color: var(--fg); }
  .tok.g { position: relative; width: 116px; height: 65px; margin: 3px 4px 3px 0; border-radius: 6px; overflow: hidden; cursor: pointer; background: #23272f center/cover; border: 2px solid transparent; opacity: .72; }
  .tok.g.seen { opacity: 1; }
  .tok.g span { position: absolute; left: 0; right: 0; bottom: 0; padding: 9px 5px 2px; font: 10.5px var(--mono); color: #fff; background: linear-gradient(transparent, rgba(0, 0, 0, .78)); }
  .tok.p { font: 12px var(--mono); line-height: 1; padding: 5px 8px; margin: 0 2px; border-radius: 11px; cursor: pointer; color: #7d838f; background: #1d2128; border: 1px solid #2c313b; white-space: nowrap; }
  .tok.p.seen { color: #b4b9c3; }
  .tok.p.ai { box-shadow: none; border-bottom: 3px solid var(--ai); }
  .tok.p.take { background: rgba(67, 184, 113, .30); border-color: var(--take); color: #effff4; }
  .tok.p.skip { background: rgba(226, 89, 77, .13); border-color: #6e3a35; color: #8f7572; text-decoration: line-through; }
  .tok.p.sel { background-color: rgba(108, 155, 255, .30); }
  .tok.g em { position: absolute; top: 3px; right: 4px; font: 700 10px var(--mono); font-style: normal; padding: 0 4px; border-radius: 3px; display: none; }
  .tok.ai { box-shadow: inset 0 -3px 0 var(--ai); }
  .tok.g.ai { box-shadow: none; border-bottom-color: var(--ai); }
  .tok.w.take { background: rgba(67, 184, 113, .30); color: #effff4; }
  .tok.w.skip { background: rgba(226, 89, 77, .13); color: #8f7572; text-decoration: line-through; }
  .tok.g.take { border-color: var(--take); opacity: 1; } .tok.g.take em { display: block; background: var(--take); color: #05210f; }
  .tok.g.skip { border-color: var(--skip); opacity: .38; filter: grayscale(.8); } .tok.g.skip em { display: block; background: var(--skip); color: #2a0703; }
  .tok.sel { outline: 2px solid var(--sel); outline-offset: -1px; background-color: rgba(108, 155, 255, .30); }
  .tok.g.sel { opacity: 1; outline-offset: 0; }
  .tok.now { box-shadow: inset 0 0 0 2px #fff; }
  .tok.w.now.ai { box-shadow: inset 0 0 0 2px #fff, inset 0 -5px 0 var(--ai); }
  .airow { grid-column: 2; display: flex; gap: 8px; align-items: center; margin: 4px 0 2px; padding: 4px 8px; border-left: 3px solid var(--ai); background: rgba(242, 162, 74, .09); border-radius: 0 6px 6px 0; font-size: 13px; }
  .airow b { color: var(--ai); font: 700 11px var(--mono); letter-spacing: .06em; white-space: nowrap; }
  .airow .n { flex: 1; color: #e6d9c6; }
  .airow button { padding: 1px 8px; font-size: 12px; }
  .airow .done { font: 700 11px var(--mono); }

  /* ── selection bar ── */
  #bar { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: none; gap: 8px; align-items: center; padding: 9px 12px; background: #262b35; border: 1px solid #47506180; border-radius: 12px; box-shadow: 0 14px 40px rgba(0, 0, 0, .6); z-index: 5; max-width: calc(100% - 30px); }
  #bar.show { display: flex; }
  #bar .rng { font: 600 13px var(--mono); padding: 0 4px; white-space: nowrap; }
  #bar input { width: 210px; }
  #toast { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: var(--ai); color: #241300; font-weight: 700; padding: 7px 14px; border-radius: 9px; z-index: 9; display: none; }
  #help { padding: 8px 14px 0; font-size: 12px; color: var(--dim); line-height: 1.75; }
  #help b { color: var(--fg); font-weight: 600; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: baseline; }
</style>
</head>

  lastT = t;
  if (mode === "sel" && sel && t >= sel.b) { V.pause(); mode = null; }
  if (mode === "takes") {
    const ts = uc(cur.id).marks.filter((m) => m.kind === "take"), inside = ts.find((m) => t >= m.a - 0.05 && t < m.b);

V.addEventListener("play", () => { lastT = V.currentTime; });
function tick(now) {
  requestAnimationFrame(tick);
  if (!cur) return;
  const t = V.currentTime, ph = $("ph");
  if (ph) ph.style.left = pct(t);
  track();
  const i = tokAt(t);
  if (i !== nowIdx) {
    if (nowIdx >= 0 && tokEls[nowIdx]) tokEls[nowIdx].classList.remove("now");
    nowIdx = i;
    if (i >= 0) { tokEls[i].classList.add("now"); if (!V.paused && now - userScrollAt > 2500) { const r = tokEls[i].getBoundingClientRect(), b = $("text").getBoundingClientRect(); if (r.top < b.top + 30 || r.bottom > b.bottom - 150) tokEls[i].scrollIntoView({ block: "center", behavior: "smooth" }); } }
  }
  if (now - lastPaint > 1200 && !V.paused) { lastPaint = now; paint(); drawStrip(); if (dirty) { clearTimeout(saveTimer); saveTimer = setTimeout(save, 1500); } }
}
V.addEventListener("seeking", () => { lastT = null; });
V.addEventListener("pause", () => { paint(); drawStrip(); drawSide(); if (dirty) save(); });

// ───────────────────────── mouse: words, thumbnails, strip ─────────────────────────
let drag = null;
const tokIdx = (e) => { const el = e.target.closest(".tok"); return el ? +el.dataset.i : -1; };
$("text").addEventListener("mousedown", (e) => {
  const i = tokIdx(e); if (i < 0 || e.button) return;
  if (e.shiftKey && anchor != null) { drag = { a: anchor, b: i, moved: true }; selTok(drag.a, drag.b); return; }
  drag = { a: i, b: i, moved: false };
});
$("text").addEventListener("mousemove", (e) => {
  if (!drag || !(e.buttons & 1)) return;
  const i = tokIdx(e); if (i < 0 || i === drag.b) return;
  drag.b = i; drag.moved = true; selTok(drag.a, drag.b);
});
window.addEventListener("mouseup", () => {
  if (!drag) return;
  if (!drag.moved) { anchor = drag.a; seek(tokens[drag.a].s); if (sel) setSel(null); }
  else anchor = drag.a;
  drag = null;
});
$("text").addEventListener("dblclick", (e) => { // the whole phrase / the whole silent stretch
  const i = tokIdx(e); if (i < 0) return;
  const kids = [...tokEls[i].parentNode.children].map((el) => +el.dataset.i);
  selTok(kids[0], kids[kids.length - 1]);
});
function selTok(i, j) { const a = Math.min(i, j), b = Math.max(i, j); setSel(tokens[a].s, tokens[b].e); }
$("text").addEventListener("scroll", () => { userScrollAt = performance.now(); }, { passive: true });
$("text").addEventListener("wheel", () => { userScrollAt = performance.now(); }, { passive: true });

let sdrag = null;
const stripT = (e) => { const r = $("strip").getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * cur.dur; };
$("strip").addEventListener("mousedown", (e) => { sdrag = { t0: stripT(e), moved: false }; });
window.addEventListener("mousemove", (e) => { if (!sdrag) return; const t = stripT(e); if (Math.abs(t - sdrag.t0) > cur.dur * 0.004) { sdrag.moved = true; setSel(sdrag.t0, t); } });
window.addEventListener("mouseup", (e) => { if (!sdrag) return; if (!sdrag.moved) { seek(stripT(e)); scrollToTime(stripT(e)); } sdrag = null; });

// ───────────────────────── keyboard ─────────────────────────
let selIn = null;
window.addEventListener("keydown", (e) => {
  if (!cur || e.metaKey || e.ctrlKey) return;
  const tag = document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") { if (e.key === "Escape") document.activeElement.blur(); return; }
  const k = e.key.toLowerCase(), code = e.code;
  const stop = () => { e.preventDefault(); if (document.activeElement === V) V.blur(); };
  if (code === "Space") { stop(); mode = null; V.paused ? V.play() : V.pause(); }
  else if (code === "ArrowLeft") { stop(); seek(V.currentTime - (e.shiftKey ? 10 : 2)); }
  else if (code === "ArrowRight") { stop(); seek(V.currentTime + (e.shiftKey ? 10 : 2)); }
  else if (code === "ArrowUp" && e.shiftKey) { stop(); step(-1); }
  else if (code === "ArrowDown" && e.shiftKey) { stop(); step(1); }
  else if (code === "KeyI") { stop(); selIn = V.currentTime; if (sel && sel.b > selIn) setSel(selIn, sel.b); else toast(t("toastIn", { t: tcf(selIn) })); }
  else if (code === "KeyO") { stop(); const a = selIn != null && selIn < V.currentTime ? selIn : sel ? sel.a : null; if (a == null) toast(t("toastNeedIn")); else setSel(a, V.currentTime); }
  else if (code === "KeyE" || code === "Enter") { stop(); act("take"); }
  else if (code === "KeyX") { stop(); act("skip"); }
  else if (code === "Backspace" || code === "Delete") { stop(); act("clear"); }
  else if (code === "KeyP") { stop(); sel ? playSel() : playTakes(); }
  else if (code === "KeyN" && sel) { stop(); $("selnote").focus(); }
  else if (code === "Escape") { stop(); setSel(null); mode = null; }
  else if (code === "KeyT") { stop(); toggleView(); }
  else if (["1", "2", "3", "4"].includes(k)) { stop(); V.playbackRate = [1, 1.5, 2, 3][+k - 1]; drawHead(); }
});
window.addEventListener("beforeunload", () => { if (dirty) navigator.sendBeacon && fetch("/api/user", { method: "PUT", keepalive: true, headers: { "Content-Type": "application/json" }, body: JSON.stringify(U) }); });

// ───────────────────────── boot ─────────────────────────
(async function () {
  try {
    P = await (await fetch("/api/project")).json();
    const u = await (await fetch("/api/user")).json(); U = u.data; U.clips = U.clips || {}; U.replies = U.replies || {};
    await poll();
    $("ptitle").textContent = "· " + P.title; document.title = t("docTitle", { title: P.title });
    let id = null; try { id = localStorage.getItem("otbor.cur"); } catch (e) { console.warn("localStorage unavailable:", e); }
    const q = new URLSearchParams(location.search);  // ?clip=GX011520 or ?day=11.10 opens right there
    const want = q.get("clip") || (P.clips.find((c) => c.day === q.get("day")) || {}).id;
    if (want && P.clips.some((c) => c.id === want)) id = want;
    openClip(id || P.clips[0].id);
    $("save").textContent = t("ready");
    setInterval(poll, 2500);
    requestAnimationFrame(tick);
  } catch (e) { $("save").className = "err"; $("save").textContent = t("loadFailed", { err: e.message }); }
})();
</script>
