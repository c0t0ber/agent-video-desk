<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Script Desk</title>
<style>
  :root {
    --bg: #121418; --panel: #1a1d23; --panel2: #20242c; --line: #2c313b; --fg: #ebe8e2; --dim: #8d929d;
    --ai: #f2c94c; --me: #6c9bff; --cl: #f2a24a; --ins: #43b871; --del: #e2594d; --sel: #6c9bff;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  button { font: inherit; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: #4a5160; background: #262b34; }
  button:disabled { opacity: .45; cursor: default; }
  button.on { background: #33405c; border-color: var(--sel); }
  button.go { background: #2a4a35; border-color: var(--ins); color: #d6f5e0; font-weight: 600; }
  button.ai { border-color: var(--ai); color: #fbe9b0; }
  button.me { border-color: var(--me); color: #d4e1ff; }
  button.small { padding: 2px 8px; font-size: 12px; }
  button.mic.rec { background: #6b1f1a; border-color: #ff5a4d; color: #fff; animation: pulse 1.2s infinite; }
  kbd { font: 11px var(--mono); background: #2b303a; border: 1px solid #3a404c; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: #cfd3da; margin-left: 5px; }
  textarea, input[type=text] { font: inherit; color: var(--fg); background: #15181d; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
  textarea:focus, input:focus { outline: none; border-color: var(--sel); }
  body { display: grid; grid-template-columns: 1fr 400px; }

  /* ── main column ── */
  main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  #bar { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  #bar button, #bar .chip, #bar h1 { white-space: nowrap; }
  #bar h1 { font-size: 16px; font-weight: 700; margin-right: 6px; }
  #bar h1 #pname { color: var(--dim); font-weight: 500; }
  #bar .sp { flex: 1; }
  .chip { font: 12px var(--mono); padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); }
  .chip.warn { color: #ffe1a8; border-color: #7a5a1f; }
  .chip.wait { color: #fbe9b0; border-color: var(--ai); animation: pulse 1.6s infinite; }
  .chip.ok { color: #d6f5e0; border-color: var(--ins); }
  @keyframes pulse { 50% { opacity: .55; } }
  #scroll { flex: 1; overflow-y: auto; position: relative; }
  #doc { max-width: 780px; margin: 0 auto; padding: 28px 34px 40vh; font-size: 16.5px; line-height: 1.62; }
  #doc .ln { min-height: 1.62em; white-space: pre-wrap; word-wrap: break-word; }
  #doc .ln.empty { min-height: .7em; }
  #doc .h1 { font-size: 26px; font-weight: 750; line-height: 1.3; margin-top: 10px; }
  #doc .h2 { font-size: 21px; font-weight: 700; line-height: 1.35; margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--line); }
  #doc .h3 { font-size: 17.5px; font-weight: 700; margin-top: 8px; }
  #doc .quote { border-left: 3px solid #4a5160; padding-left: 12px; color: #d8d4cc; font-style: italic; }
  #doc .li { padding-left: 14px; text-indent: -14px; }
  #doc .hr { color: var(--dim); text-align: center; }
  #doc .tbl { font: 13px var(--mono); color: #cfd3da; }
  #doc .mk { color: #5a606c; font-weight: 400; font-style: normal; }
  #doc .b { font-weight: 700; }
  #doc .scr { color: #9fb6e6; font-style: italic; }
  #doc .tc { color: #9fb6e6; text-decoration: underline dotted; cursor: pointer; }
  #doc .n-ai { background: rgba(242, 201, 76, .17); border-bottom: 2px solid var(--ai); cursor: pointer; }
  #doc .n-me { background: rgba(108, 155, 255, .15); border-bottom: 2px solid var(--me); cursor: pointer; }
  #doc .n-c { background: rgba(242, 162, 74, .14); border-bottom: 2px dashed var(--cl); cursor: pointer; }
  #doc .flash { animation: flash 1.2s 2; }
  @keyframes flash { 50% { background: rgba(255, 255, 255, .28); } }
  #doc .del { background: rgba(226, 89, 77, .18); color: #ffb3ab; text-decoration: line-through; text-decoration-color: rgba(255, 140, 130, .8); cursor: pointer; }
  #doc .ins { background: rgba(67, 184, 113, .2); color: #c9f3d8; cursor: pointer; }
  #doc .del.off { background: none; color: var(--fg); text-decoration: none; outline: 1px dashed #4a5160; }
  #doc .ins.off { background: none; color: #5d6470; text-decoration: line-through; }
  #doc .ro .del, #doc .ro .ins { cursor: default; }
  #doc [data-n]::before { content: attr(data-n); font: 700 10.5px var(--mono); color: #121418; background: var(--ins); border-radius: 4px; padding: 0 4px; margin-right: 3px; vertical-align: 2px; text-decoration: none; display: inline-block; }
  #doc .off[data-n]::before { background: #5d6470; }
  #doc .cur-edit { outline: 2px solid #fff; outline-offset: 1px; }
  #editor { display: none; max-width: 820px; margin: 0 auto; padding: 22px 30px; height: 100%; }
  #editor textarea { height: calc(100vh - 140px); font-size: 15.5px; line-height: 1.6; resize: none; padding: 14px 16px; }
  body.editing #doc { display: none; } body.editing #editor { display: block; }

  /* ── side panel ── */
  #side { display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--panel); height: 100vh; min-height: 0; }
  #tabs { display: flex; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  #tabs button { flex: 1; padding: 5px 4px; font-size: 13px; }
  #tabs b { font: 600 11px var(--mono); color: var(--dim); margin-left: 4px; }
  .pane { flex: 1; overflow-y: auto; display: none; padding: 6px 0 30px; min-height: 0; }
  .pane.cur { display: block; }
  .lh { padding: 12px 14px 4px; font: 700 11px var(--mono); letter-spacing: .1em; color: var(--dim); display: flex; justify-content: space-between; align-items: center; }
  .card { margin: 4px 10px; padding: 8px 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); border-left-width: 3px; }
  .card.ai { border-left-color: var(--ai); } .card.me { border-left-color: var(--me); } .card.cl { border-left-color: var(--cl); }
  .card.done { opacity: .55; }
  .card.lost .q::after { content: var(--t-lost); /* text set from STR by applyI18n() */ color: var(--del); font-style: normal; }
  .card .q { font-size: 12px; color: var(--dim); font-style: italic; cursor: pointer; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .card .q:hover { color: var(--fg); }
  .card .t { margin-top: 4px; font-size: 13.5px; white-space: pre-wrap; cursor: text; }
  .card .ans { margin-top: 6px; padding: 6px 8px; border-radius: 6px; background: #2a2620; border: 1px solid #4d3d22; font-size: 13px; white-space: pre-wrap; }
  .card .ans::before { content: var(--t-ai-label); /* text set from STR by applyI18n() */ color: var(--cl); font-weight: 700; }
  .card .acts { margin-top: 6px; display: flex; gap: 5px; flex-wrap: wrap; }
  .card textarea { margin-top: 5px; font-size: 13px; min-height: 52px; resize: vertical; }
  .empty { padding: 6px 14px; color: var(--dim); font-size: 12.5px; }
  .edit { margin: 5px 10px; padding: 8px 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); cursor: pointer; }
  .edit.off { opacity: .55; }
  .edit.cur { border-color: #fff; }
  .edit .r1 { display: flex; gap: 8px; align-items: baseline; }
  .edit .num { font: 700 11px var(--mono); color: #121418; background: var(--ins); border-radius: 4px; padding: 0 5px; }
  .edit.off .num { background: #5d6470; }
  .edit .why { font-size: 13.5px; flex: 1; }
  .edit .nt { font-size: 12px; color: var(--dim); margin-top: 3px; }
  .edit .pv { margin-top: 5px; font-size: 12.5px; line-height: 1.45; max-height: 7.5em; overflow: hidden; }
  .edit .pv s { color: #ff9d94; } .edit .pv u { color: #9fe3b8; text-decoration: none; }
  #summary { margin: 8px 12px; font-size: 13.5px; }
  #acceptbox { position: sticky; bottom: 0; padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--line); display: flex; gap: 6px; }
  #acceptbox button.go { flex: 1; }
  .ver { padding: 8px 14px; cursor: pointer; border-left: 3px solid transparent; }
  .ver:hover { background: #20242b; }
  .ver.cur { background: #252a34; border-left-color: var(--sel); }
  .ver .r1 { display: flex; justify-content: space-between; } .ver b { font: 700 13px var(--mono); }
  .ver .m { font: 11.5px var(--mono); color: var(--dim); }
  .ver .s { font-size: 12.5px; color: #cfd3da; margin-top: 2px; }
  #rec { padding: 8px 12px; border-bottom: 1px solid var(--line); position: sticky; top: -6px; z-index: 2; background: var(--panel); }
  #rec audio { width: 100%; height: 34px; }
  #rec .row { display: flex; gap: 6px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--dim); }
  .seg { padding: 4px 14px 5px; cursor: pointer; font-size: 13px; line-height: 1.4; }
  .seg:hover { background: #20242b; }
  .seg.cur { background: #252a34; }
  .seg i { font: 11.5px var(--mono); color: var(--dim); font-style: normal; margin-right: 6px; }

  /* ── popover / toast / help ── */
  #pop { position: fixed; z-index: 20; width: 340px; background: var(--panel); border: 1px solid #4a5160; border-radius: 10px; padding: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.55); display: none; }
  #pop .q { font-size: 12px; color: var(--dim); font-style: italic; margin-bottom: 6px; max-height: 3.2em; overflow: hidden; }
  #pop textarea { min-height: 64px; resize: vertical; }
  #pop .acts { display: flex; gap: 6px; margin-top: 7px; }
  #pop .acts button { flex: 1; font-size: 12.5px; padding: 5px 6px; }
  #fixpop { position: fixed; z-index: 20; width: 360px; top: 52px; background: var(--panel); border: 1px solid #4a5160; border-radius: 10px; padding: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.55); display: none; }
  #fixpop p { font-size: 13px; color: var(--dim); margin-bottom: 8px; }
  #fixpop .acts { display: flex; gap: 6px; margin-top: 8px; } #fixpop .acts button.go { flex: 1; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #2a2f39; border: 1px solid #4a5160; padding: 9px 16px; border-radius: 9px; display: none; z-index: 30; max-width: 70vw; }
  #toast.err { background: #8f2b22; border-color: #c4453a; }
  #help { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; z-index: 40; align-items: center; justify-content: center; }
  #help .box { background: var(--panel); border: 1px solid #4a5160; border-radius: 12px; padding: 20px 24px; max-width: 560px; font-size: 14px; line-height: 1.55; }
  #help h2 { font-size: 17px; margin-bottom: 8px; } #help li { margin-left: 18px; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <div id="bar">
    <h1><span data-i18n="app"></span> <span id="pname"></span></h1>
    <span class="chip" id="verchip"></span>
    <span class="chip warn" id="draftchip" style="display:none" data-i18n="chip.draft"></span>
    <span class="chip" id="fixchip" style="display:none"></span>
    <span class="sp"></span>
    <button id="bDiff" data-i18n-title="bar.diff.title" data-i18n="bar.diff"></button>
    <button id="bProp" style="display:none" data-i18n-title="bar.prop.title" data-i18n="bar.prop"></button>
    <button id="bVoice" class="mic" data-i18n-title="bar.voice.title">🎙 <span data-i18n="bar.voice"></span><kbd>R</kbd></button>
    <button id="bEdit" data-i18n-title="bar.edit.title"><span data-i18n="bar.edit"></span><kbd>E</kbd></button>
    <button id="bFix" class="ai" data-i18n-title="bar.fix.title"><span data-i18n="bar.fix"></span><kbd>F</kbd></button>
    <button id="bHelp" class="small">?</button>
  </div>
  <div id="scroll">
    <div id="doc"></div>
    <div id="editor"><textarea id="ed" spellcheck="true"></textarea></div>
  </div>
</main>
<aside id="side">
  <div id="tabs">
    <button data-tab="notes" class="on"><span data-i18n="tab.notes"></span><b id="cNotes"></b></button>
    <button data-tab="edits"><span data-i18n="tab.edits"></span><b id="cEdits"></b></button>
    <button data-tab="rec" data-i18n="tab.rec"></button>
    <button data-tab="vers"><span data-i18n="tab.vers"></span><b id="cVers"></b></button>
  </div>
  <div class="pane cur" id="p-notes"></div>
  <div class="pane" id="p-edits"></div>
  <div class="pane" id="p-rec"><div id="rec"></div><div id="segs"></div></div>
  <div class="pane" id="p-vers"></div>
</aside>
<div id="pop">
  <div class="q" id="popq"></div>
  <textarea id="popt" data-i18n-placeholder="pop.placeholder"></textarea>
  <div class="acts">
    <button class="ai" id="popAi"><span data-i18n="pop.ai"></span><kbd>↵</kbd></button>
    <button class="me" id="popMe"><span data-i18n="pop.me"></span><kbd>⇧↵</kbd></button>
    <button class="mic" id="popMic" data-i18n-title="pop.mic.title">🎙</button>
    <button id="popX">Esc</button>
  </div>
</div>
<div id="fixpop">
  <p id="fixinfo"></p>
  <textarea id="fixc" data-i18n-placeholder="fix.placeholder"></textarea>
  <div class="acts"><button class="go" id="fixGo"><span data-i18n="fix.go"></span><kbd>⌘↵</kbd></button><button class="mic" id="fixMic">🎙</button><button id="fixX">Esc</button></div>
</div>
<div id="toast"></div>
<div id="help"><div class="box">
  <h2 data-i18n="help.title"></h2>
  <ul>
    <li data-i18n-html="help.select"></li>
    <li data-i18n-html="help.edit"></li>
    <li data-i18n-html="help.fix"></li>
    <li data-i18n-html="help.accept"></li>
    <li data-i18n-html="help.voice"></li>
    <li data-i18n-html="help.timecodes"></li>
    <li data-i18n-html="help.file"></li>
  </ul>
</div></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = t => { t = Math.max(0, t); const m = Math.floor(t / 60), s = Math.floor(t % 60); return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`; };
const now = () => new Date().toLocaleString("sv-SE").slice(0, 19);

/* ── i18n: every user-visible string lives in STR ──
   Language: English by default; ?lang=ru switches to Russian.
   t(key, vars) fills {name} placeholders; tn(key, n, vars) also picks a plural form when the entry is an array
   (en: [one, other]; ru: [one, few, many]). A plain string entry is used as is for any n.
   Keys used with data-i18n-html and the help.* keys contain trusted markup; all other values are plain text. */
const LANG = (() => {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "en" || q === "ru") return q;
  if (q) console.warn(`i18n: unsupported ?lang=${q}, using English`);
  return "en";
})();
document.documentElement.lang = LANG;
const STR = {

    "fix.go": "Send to AI",

    "fix.info.notes": ["note", "notes"],
    "fix.info.draft": " and your hand edits",
    "help.title": "How it works",
    "help.select": "Select a piece of text → a note <b>for AI</b> (the AI will fix it) or a <b>note to self</b> (the AI leaves it alone, only takes it into account).",
    "help.edit": "<b>Edit text</b> <kbd>E</kbd> — edit by hand. This goes into the next version together with the AI edits.",
    "help.fix": "<b>Fix</b> <kbd>F</kbd> — the AI gets all notes for AI and proposes edits. They show up in the “Edits” tab and right in the text.",
    "help.accept": "Click an edit in the text or in the list — take / skip. <b>Accept</b> saves a new version snapshot: your hand edits + the AI edits you marked.",
    "help.voice": "<b>🎙</b> — dictate by voice: in the note box (for the selected piece), “Dictate” at the top <kbd>R</kbd> (a general note for the whole script), in the fix and in replies to the AI. Click again to stop; the text appears in a few seconds.",
    "help.timecodes": "Timecodes in the text are clickable — the recording plays from that point.",
    "help.file": "The current version always lives in <code>{mirror}</code> in the project folder.",
    "css.lost": " · place lost",

  ru: {

/* ── markdown-ish decoration over a string (no characters hidden, so offsets stay 1:1) ── */

/* Paint `str` into #doc. ranges: {a, b, cls, note?, edit?, t?}. withOffsets: spans carry data-s so a selection maps back to W. */

  const bs = [...cuts].filter(x => x >= 0 && x <= str.length).sort((x, y) => x - y);
  const byStart = ranges.slice().sort((x, y) => x.a - y.a);

  if (md.lines.length) openLine(0);
  for (let k = 0; k < bs.length - 1; k++) {

      continue;
    }
    while (ri < byStart.length && byStart[ri].a <= p) active.push(byStart[ri++]);
    active = active.filter(r => r.b > p);
    const cover = active.filter(r => r.a <= p && r.b >= q);
    const cls = [...new Set(cover.map(r => r.cls).join(" ").split(" ").filter(Boolean))];
    const attrs = [];
    if (withOffsets) attrs.push(`data-s="${p}"`);
    const notes = cover.filter(r => r.note).map(r => r.note);
    if (notes.length) attrs.push(`data-notes="${notes.join(" ")}"`);
    const ed = cover.find(r => r.edit);

    if (tc) attrs.push(`data-t="${tc.t}"`);

  }

/* ── diff: lines first, then words inside the changed blocks (keeps Myers small) ── */

      ${isC ? `<button class="small mic" data-mic-reply="${n.id}">🎙</button>` : ""}

}
let showDone = false;
function drawNotes() {

  $("p-notes").innerHTML = `<div class="lh"><span>${t("notes.hint")}</span><button class="small" id="bDone">${showDone ? t("notes.hideClosed") : t("notes.showClosed")}</button></div>`
    + sect(t("notes.forAi"), ai, "ai") + sect(t("notes.fromAi"), cl, "cl") + sect(t("notes.toMe"), me, "me");
}
function edPreview(e) {

}
function drawEdits() {

    <div class="lh"><span>${t("edits.header", { on, total: p.edits.length })}</span><span><button class="small" data-all="take">${t("edits.all")}</button> <button class="small" data-all="skip">${t("edits.noneBtn")}</button></span></div>`
    + p.edits.map((e, i) => {

        ${n ? `<div class="nt">${t("edits.forNote", { text: esc(n.text.slice(0, 120)) })}</div>` : ""}

    + `<div id="acceptbox"><button class="go" id="bAccept">${t("edits.accept", { v: P.versions.length })}${U.draft != null ? t("edits.acceptDraft") : ""}</button></div>`;

function drawVers() {

    <div class="r1"><b>${v.name}${v.name === latest ? t("vers.current") : ""}</b><span class="m">${esc(v.made || "")}</span></div>

function drawRec() {

  $("rec").innerHTML = `${tr.audio ? `<audio id="au" controls preload="metadata" src="/media/${encodeURI(tr.audio)}"></audio>` : `<div class="empty">${t("rec.noAudio", { name: esc(tr.name) })}</div>`}
    <div class="row"><span>${tn("rec.segments", tr.segments.length, { name: esc(tr.name) })}</span><span style="flex:1"></span><label><input type="checkbox" id="follow" checked> ${t("rec.follow")}</label></div>`;
  $("segs").innerHTML = tr.segments.map((s, i) => `<div class="seg" data-seg="${i}"><i>${fmt(s.start)}</i>${esc(s.text)}</div>`).join("");

async function draw() { drawBar(); await drawDoc(); drawNotes(); drawEdits(); drawVers(); }
function setTab(t) {

function toast(t, err) { const el = $("toast"); el.textContent = t; el.className = err ? "err" : ""; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", err ? 6000 : 3200); }

/* ── save / poll ── */
function touch() { dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(save, 600); try { localStorage.setItem("pravka." + P.name, JSON.stringify(U)); } catch (e) { console.warn("localStorage unavailable:", e); } }
async function save() {
  clearTimeout(saveTimer);
  try {
    const r = await fetch("/api/user", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(U) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error);
    userMtime = j.mtime; dirty = false;
  } catch (e) { toast(t("toast.notSaved", { msg: e.message }), true); }
}
async function poll() {
  try {
    const p = await getJSON("/api/poll");
    let redraw = false;
    if (p.agent !== agentMtime) {
      const was = C.proposal && C.proposal.id; const c = await getJSON("/api/agent"); C = c.data; agentMtime = c.mtime; redraw = true;
      if (proposal() && C.proposal.id !== was) { setTab("edits"); toast(t("toast.agentEdits", { n: C.proposal.edits.length })); }
    }
    if (p.versions.length !== P.versions.length) { await reloadProject(); redraw = true; }
    if (p.user !== userMtime && !dirty) { const u = await getJSON("/api/user"); U = u.data; userMtime = u.mtime; await refreshW(); redraw = true; }
    if (redraw && !document.body.classList.contains("editing")) await draw(); else if (redraw) drawBar();

}
async function reloadProject() {
  const pr = await getJSON("/api/project");
  P.versions = pr.versions;
  const was = latest; latest = P.versions[P.versions.length - 1].name;
  if (view === was) view = latest;

}

/* ── actions ── */
function selOffsets() {
  const s = window.getSelection(); if (!s.rangeCount || s.isCollapsed) return null;
  const r = s.getRangeAt(0);
  const pos = (node, off) => {
    if (node.nodeType === 3) { const sp = node.parentElement.closest("[data-s]"); return sp ? +sp.dataset.s + off : null; }
    if (off < node.childNodes.length) { const ch = node.childNodes[off]; const sp = ch.nodeType === 1 ? (ch.matches("[data-s]") ? ch : ch.querySelector("[data-s]")) : null; return sp ? +sp.dataset.s : null; }
    const all = node.querySelectorAll("[data-s]"), last = all[all.length - 1]; return last ? +last.dataset.s + last.textContent.length : null;
  };
  let a = pos(r.startContainer, r.startOffset), b = pos(r.endContainer, r.endOffset);
  if (a === null || b === null) return null;
  while (a < b && /\s/.test(W[a])) a++;
  while (b > a && /\s/.test(W[b - 1])) b--;
  return b > a ? { a, b, rect: r.getBoundingClientRect() } : null;
}
let popSel = null;
function openPop(sel) {
  popSel = sel; popAudio = null;
  $("popq").textContent = t("quoted", { q: W.slice(sel.a, sel.b).slice(0, 200) });
  $("popt").value = "";
  const pop = $("pop"); pop.style.display = "block";
  const x = Math.min(window.innerWidth - 420 - 350, Math.max(10, sel.rect.left));
  const y = sel.rect.bottom + 8 + 170 > window.innerHeight ? sel.rect.top - 178 : sel.rect.bottom + 8;
  pop.style.left = x + "px"; pop.style.top = Math.max(8, y) + "px";
  setTimeout(() => $("popt").focus(), 0);
}
function closePop() { if (rec && rec.btn === $("popMic")) return; $("pop").style.display = "none"; popSel = null; }
function addNote(kind) {
  if (!popSel) return;
  const quote = W.slice(popSel.a, popSel.b);
  U.notes.push({ id: "u" + Date.now().toString(36), for: kind, text: $("popt").value.trim(), quote, start: popSel.a, end: popSel.b, ver: latest, created: now(), ...(popAudio ? { audio: popAudio } : {}) });
  closePop(); window.getSelection().removeAllRanges(); touch(); draw(); setTab("notes");
}
function goNote(id) {
  if (view !== latest) { view = latest; }
  showProp = false; showDiff = false;
  draw().then(() => {
    const el = document.querySelector(`#doc [data-notes~="${id}"]`);
    if (!el) return toast(t("toast.noteLost"));
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    document.querySelectorAll(`#doc [data-notes~="${id}"]`).forEach(s => { s.classList.remove("flash"); void s.offsetWidth; s.classList.add("flash"); });
  });
}
function goEdit(id) {

    const el = document.querySelector(`#doc [data-edit="${id}"]`);

  });
}
function toggleEdit(id, to) { const e = proposal().edits.find(x => x.id === id); U.decisions[id] = to || (taken(e) ? "skip" : "take"); touch(); curEdit = id; draw(); }
function startEditing() {
  if (view !== latest) return;
  closePop(); document.body.classList.add("editing"); $("ed").value = W; drawBar(); $("ed").focus();
}
async function stopEditing() {
  if (!document.body.classList.contains("editing")) return;
  document.body.classList.remove("editing"); await commitDraft(); await draw();
}
let draftTimer = null;
async function commitDraft() {
  clearTimeout(draftTimer);
  const v = $("ed").value, base = await loadVersion(latest);
  const draft = v === base ? null : v;
  if (draft === U.draft) return;
  U.draft = draft; U.base = latest;
  await refreshW(); touch();
}
function openFix() {

  stopEditing();
  const n = U.notes.filter(x => x.for === "ai" && !x.done).length;
  $("fixinfo").textContent = t("fix.info", { n, notes: tn("fix.info.notes", n), draft: U.draft != null ? t("fix.info.draft") : "" });
  $("fixc").value = "";
  const fp = $("fixpop"); fp.style.display = "block"; fp.style.left = Math.max(10, $("bFix").getBoundingClientRect().right - 360) + "px";
  setTimeout(() => $("fixc").focus(), 0);
}
function sendFix() {
  U.fix = { n: (U.fix ? U.fix.n : 0) + 1, at: now(), base: latest, hash: Whash, comment: $("fixc").value.trim() || null };
  U.decisions = {};
  $("fixpop").style.display = "none";

}
async function accept() {
  const p = proposal();
  const take = p ? p.edits.filter(taken).map(e => e.id) : [];

    if (dirty) await save();
    const r = await fetch("/api/accept", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ take, proposal: p ? p.id : null }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error);
    texts[j.version] = j.text;
    // close the notes that this version answered; the rest follow the new text
    for (const n of U.notes) {
      if (n.done || n.for !== "ai" || !p) continue;
      const fixed = p.edits.some(e => e.note === n.id && take.includes(e.id));
      const ans = (p.answers || []).find(a => a.note === n.id);
      if (fixed || ans) { n.done = true; n.doneIn = j.version; if (ans) n.answer = ans.text; }

    showProp = true; showDiff = false; await draw();
    toast(t("toast.saved", { v: j.version }) + (j.warning ? ` · ${j.warning}` : ""), !!j.warning);
  } catch (e) { toast(t("toast.notAccepted", { msg: e.message }), true); }

/* ── voice: record in the browser, the server transcribes with GigaAM ── */
let rec = null, popAudio = null;
const player = new Audio();
async function mic(btn, onText) {
  if (rec) { if (rec.btn === btn) rec.mr.stop(); else toast(t("toast.alreadyRec")); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { return toast(t("toast.noMic", { msg: e.message }), true); }
  const type = ["audio/webm;codecs=opus", "audio/mp4", "audio/ogg;codecs=opus"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
  const mr = new MediaRecorder(stream, type ? { mimeType: type } : {}), chunks = [], label = btn.innerHTML, t0 = Date.now();
  rec = { mr, btn };
  btn.classList.add("rec");
  const tick = setInterval(() => btn.textContent = "■ " + fmt((Date.now() - t0) / 1000), 250);
  mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    clearInterval(tick); stream.getTracks().forEach(t => t.stop()); rec = null;
    btn.classList.remove("rec"); btn.textContent = t("mic.transcribing"); btn.disabled = true;
    try {
      const blob = new Blob(chunks, { type: mr.mimeType || type || "audio/webm" });
      const r = await fetch("/api/voice", { method: "POST", headers: { "Content-Type": blob.type }, body: blob });
      const j = await r.json(); if (!r.ok) throw new Error(j.error);
      if (!j.text) toast(t("toast.nothingHeard")); else onText(j.text, j.audio);
    } catch (e) { toast(t("toast.voiceFail", { msg: e.message }), true); }
    btn.innerHTML = label; btn.disabled = false;
  };
  mr.start();
}
const append = (el, t) => { el.value = (el.value.trim() + " " + t).trim(); el.dispatchEvent(new Event("input", { bubbles: true })); };
function voiceNote() {
  if (view !== latest) return;
  mic($("bVoice"), (text, audio) => {
    U.notes.push({ id: "u" + Date.now().toString(36), for: "ai", text, quote: "", start: null, end: null, ver: latest, created: now(), audio });
    touch(); draw(); setTab("notes"); toast(t("toast.generalNote"));
  });
}
$("bVoice").onclick = voiceNote;
$("popMic").onclick = () => mic($("popMic"), (text, audio) => { if ($("pop").style.display !== "block") return toast(t("toast.popClosed", { text })); append($("popt"), text); popAudio = audio; $("popt").focus(); });
$("fixMic").onclick = () => mic($("fixMic"), text => { append($("fixc"), text); $("fixc").focus(); });

/* ── events ── */
$("doc").addEventListener("mouseup", e => {
  if (view !== latest || proposal() && showProp || showDiff) {
    const ed = e.target.closest("[data-edit]");
    if (ed && proposal() && showProp) { setTab("edits"); toggleEdit(ed.dataset.edit); }
    return;
  }
  const sel = selOffsets();
  if (sel) return openPop(sel);
  const tc = e.target.closest("[data-t]"); if (tc) return play(+tc.dataset.t);
  const nt = e.target.closest("[data-notes]");
  if (nt) { setTab("notes"); const id = nt.dataset.notes.split(" ")[0]; const c = document.querySelector(`.card[data-id="${id}"]`); if (c) { c.scrollIntoView({ block: "center", behavior: "smooth" }); c.animate([{ outline: "2px solid #fff" }, { outline: "2px solid transparent" }], 1400); } }
});
$("popAi").onclick = () => addNote("ai"); $("popMe").onclick = () => addNote("me"); $("popX").onclick = closePop;
$("popt").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.altKey) { e.preventDefault(); addNote("ai"); }
  else if (e.key === "Enter" && e.shiftKey) { e.preventDefault(); addNote("me"); }
  else if (e.key === "Escape") closePop();
});
$("fixGo").onclick = sendFix; $("fixX").onclick = () => $("fixpop").style.display = "none";
$("fixc").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) sendFix(); else if (e.key === "Escape") $("fixpop").style.display = "none"; });
$("bFix").onclick = openFix;
$("bEdit").onclick = () => document.body.classList.contains("editing") ? stopEditing() : startEditing();
$("bDiff").onclick = () => { showDiff = !showDiff; if (showDiff) showProp = false; draw(); };
$("bProp").onclick = () => { showProp = !showProp; if (showProp) showDiff = false; draw(); };
$("bHelp").onclick = () => $("help").style.display = "flex";
$("help").onclick = () => $("help").style.display = "none";
$("ed").addEventListener("input", () => { clearTimeout(draftTimer); draftTimer = setTimeout(commitDraft, 800); });
$("ed").addEventListener("keydown", e => { if (e.key === "Escape") { e.preventDefault(); stopEditing(); } });
$("tabs").onclick = e => { const b = e.target.closest("button"); if (b) setTab(b.dataset.tab); };
$("side").addEventListener("click", e => {
  const el = e.target, d = el.dataset; // `t` is the i18n helper

  if (d.go) return goNote(d.go);
  if (d.done) { const n = U.notes.find(x => x.id === d.done); n.done = !n.done; touch(); return draw(); }
  if (d.swap) { const n = U.notes.find(x => x.id === d.swap); n.for = n.for === "ai" ? "me" : "ai"; touch(); return draw(); }
  if (d.del) { if (!confirm(t("note.confirmDelete"))) return; U.notes = U.notes.filter(x => x.id !== d.del); touch(); return draw(); }
  if (d.close) { U.closed = U.closed || []; U.closed = U.closed.includes(d.close) ? U.closed.filter(x => x !== d.close) : U.closed.concat(d.close); touch(); return draw(); }
  if (d.editNote) { // edit the note text in place
    const n = U.notes.find(x => x.id === d.editNote), ta = document.createElement("textarea");
    ta.value = n.text; el.replaceWith(ta); ta.focus();
    const done = () => { n.text = ta.value.trim(); touch(); draw(); };
    ta.addEventListener("blur", done); ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ta.blur(); } if (e.key === "Escape") ta.blur(); });
    return;
  }
  if (d.toggle) { e.stopPropagation(); return toggleEdit(d.toggle); }
  if (d.play) { player.src = "/media/" + encodeURI(d.play); player.play(); return; }
  if (d.micReply) { const id = d.micReply; return mic(el, text => { const ta = document.querySelector(`textarea[data-reply="${id}"]`); if (ta) append(ta, text); }); }
  if (d.all) { for (const x of proposal().edits) U.decisions[x.id] = d.all; touch(); return draw(); }
  const ed = el.closest(".edit"); if (ed) return goEdit(ed.dataset.edit);
  const v = el.closest(".ver"); if (v) { view = v.dataset.ver; if (view !== latest) { showProp = false; } stopEditing(); return draw(); }
  const sg = el.closest(".seg"); if (sg) { const s = P.transcripts[0].segments[+sg.dataset.seg]; const au = $("au"); if (au) { au.currentTime = s.start; au.play(); } }
});
$("side").addEventListener("input", e => { const r = e.target.dataset.reply; if (r) { U.replies[r] = e.target.value; touch(); } });
// Russian-layout letters on the same physical keys as E / F / R, so the shortcuts work without switching layouts.
const RU_LAYOUT = { e: "\u0443", f: "\u0430", r: "\u043a" };
document.addEventListener("keydown", e => {
  const typing = /TEXTAREA|INPUT/.test(document.activeElement.tagName);
  if (e.key === "Escape") { closePop(); $("fixpop").style.display = "none"; $("help").style.display = "none"; }
  if (typing) return;
  if (e.key === "e" || e.key === RU_LAYOUT.e) { e.preventDefault(); startEditing(); }
  else if (e.key === "f" || e.key === RU_LAYOUT.f) { e.preventDefault(); openFix(); }
  else if (e.key === "r" || e.key === RU_LAYOUT.r) { e.preventDefault(); voiceNote(); }
  else if (e.key === " " && $("au")) { e.preventDefault(); const au = $("au"); au.paused ? au.play() : au.pause(); }
  else if (e.key === "?") $("help").style.display = "flex";
});
window.addEventListener("beforeunload", () => { if (dirty) fetch("/api/user", { method: "PUT", keepalive: true, headers: { "Content-Type": "application/json" }, body: JSON.stringify(U) }); });

(async function () {
  try {
    P = await getJSON("/api/project");
    P.audio = !!(P.transcripts[0] && P.transcripts[0].audio);
    const u = await getJSON("/api/user"); U = u.data; userMtime = u.mtime;
    U.replies = U.replies || {}; U.decisions = U.decisions || {}; U.closed = U.closed || [];
    const c = await getJSON("/api/agent"); C = c.data; agentMtime = c.mtime;
    latest = P.versions[P.versions.length - 1].name; view = latest;
    await refreshW();
    document.title = t("app") + " · " + P.name; { const hf = document.querySelector('[data-i18n-html="help.file"]'); if (hf) hf.innerHTML = t("help.file", { mirror: esc(P.mirror || "script.md") }); }
    drawRec(); await draw();
    if (proposal()) setTab("edits"); // the agent's edits are waiting for a decision
    if (!U.notes.length && !localStorage.getItem("pravka.help")) { $("help").style.display = "flex"; try { localStorage.setItem("pravka.help", "1"); } catch (e) { console.warn("localStorage unavailable:", e); } }
    poll();
  } catch (e) { document.body.innerHTML = `<pre style="padding:30px;color:#ffb3ab">${esc(t("load.fail", { msg: e.message }))}</pre>`; }
})();
</script>
